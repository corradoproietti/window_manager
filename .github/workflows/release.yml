name: Release CinnaWM Extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext zip

      - name: Validate gettext catalogs and Python scripts
        run: |
          python3 -m py_compile cinnawm@corradoproietti/settings_data.py cinnawm@corradoproietti/settings-window.py
          msgfmt -c -o /dev/null cinnawm@corradoproietti/po/it.po

      - name: Build installable extension archive
        run: bash package-release.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          gh release create "${TAG}" \
            dist/*.zip \
            dist/*.zip.sha256 \
            --title "CinnaWM ${TAG}" \
            --notes-file "dist/RELEASE_NOTES-v${VERSION}.md" \
            || gh release upload "${TAG}" dist/*.zip dist/*.zip.sha256 --clobber
