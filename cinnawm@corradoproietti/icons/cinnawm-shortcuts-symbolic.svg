<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Keyboard Outer Body -->
  <rect x="1" y="3" width="14" height="10" rx="1.8" fill="none" stroke="#e0e6ff" stroke-width="1.3" opacity="0.9"/>
  <!-- Top Row Keys -->
  <rect x="3" y="5" width="1.8" height="1.6" rx="0.4" fill="#e0e6ff"/>
  <rect x="5.7" y="5" width="1.8" height="1.6" rx="0.4" fill="#e0e6ff"/>
  <rect x="8.5" y="5" width="1.8" height="1.6" rx="0.4" fill="#e0e6ff"/>
  <rect x="11.2" y="5" width="1.8" height="1.6" rx="0.4" fill="#e0e6ff"/>
  <!-- Middle Row Keys -->
  <rect x="3" y="7.4" width="2.2" height="1.6" rx="0.4" fill="#e0e6ff" opacity="0.8"/>
  <rect x="6.1" y="7.4" width="1.8" height="1.6" rx="0.4" fill="#e0e6ff" opacity="0.8"/>
  <rect x="8.8" y="7.4" width="1.8" height="1.6" rx="0.4" fill="#e0e6ff" opacity="0.8"/>
  <rect x="11.5" y="7.4" width="1.5" height="1.6" rx="0.4" fill="#e0e6ff" opacity="0.8"/>
  <!-- Spacebar Row -->
  <rect x="4.5" y="9.8" width="7" height="1.5" rx="0.4" fill="#e0e6ff" opacity="0.9"/>
</svg>
