<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b3448"/>
      <stop offset="100%" stop-color="#181e2c"/>
    </linearGradient>
    <linearGradient id="masterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="stackTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="stackBotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Outer rounded app squircle -->
  <rect x="12" y="12" width="232" height="232" rx="48" ry="48" fill="url(#bgGrad)" stroke="#4b5563" stroke-width="6"/>

  <!-- Left Master Tile (Active highlighted window) -->
  <rect x="34" y="34" width="102" height="188" rx="20" ry="20" fill="url(#masterGrad)"/>
  <rect x="48" y="48" width="44" height="10" rx="5" ry="5" fill="#ffffff" fill-opacity="0.85"/>

  <!-- Top-Right Stack Tile -->
  <rect x="150" y="34" width="72" height="87" rx="18" ry="18" fill="url(#stackTopGrad)"/>
  <rect x="164" y="48" width="32" height="8" rx="4" ry="4" fill="#1e293b" fill-opacity="0.55"/>

  <!-- Bottom-Right Stack Tile -->
  <rect x="150" y="135" width="72" height="87" rx="18" ry="18" fill="url(#stackBotGrad)"/>
  <rect x="164" y="149" width="32" height="8" rx="4" ry="4" fill="#1e293b" fill-opacity="0.45"/>
</svg>
